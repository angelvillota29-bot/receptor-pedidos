<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receptor de Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-bar">
    <h1 class="brand-title">🎫 Receptor de Pedidos</h1>
    <div class="top-actions">
      <span id="last-update" class="last-update"></span>
      <button id="refresh-btn" class="btn-primary-sm">Actualizar</button>
    </div>
  </header>

  <div id="config-warning" class="config-warning hidden">
    ⚠️ Falta configurar <code>RESTAURANTE_API_URL</code> y/o <code>RESTAURANTE_API_KEY</code> como variables de entorno de este servicio.
  </div>

  <main id="orders-grid" class="orders-grid"></main>
  <p id="empty-msg" class="empty-msg hidden">No hay pedidos por ahora. Los nuevos pedidos aparecen solos aquí (se actualiza cada 20 segundos).</p>

  <div id="print-area" class="hidden"></div>

  <script src="script.js"></script>
</body>
</html>
